<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#a91f54"><title>Um presente especial para Juliana Terneiro 🎁</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at top,#ffe6a3,#ff93ae 55%,#a91f54);font-family:system-ui,-apple-system,sans-serif;text-align:center;color:#51203a;padding:18px}.panel{background:#fff9;border:2px solid #fff8;border-radius:28px;padding:30px 18px;max-width:650px;width:100%;box-shadow:0 15px 50px #5b163c44}h1{font-size:clamp(1.7rem,6vw,2.8rem);margin:8px 0}p{font-size:1.1rem;line-height:1.5}.gift{font-size:6rem;animation:float 1.8s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-12px) rotate(5deg)}}button{background:#d71c63;color:white;border:0;border-radius:100px;padding:17px 28px;font-weight:800;font-size:1.1rem;cursor:pointer;box-shadow:0 7px 0 #911143}button:focus-visible{outline:4px solid #333}#reveal{display:none}#reveal img{display:block;width:100%;height:auto;border-radius:16px}#count{font-size:5rem;font-weight:900;min-height:100px}small{display:block;margin-top:20px}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;width:10px;height:18px;animation:fall 3.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}@media(prefers-reduced-motion:reduce){.gift,.piece{animation:none}}</style></head><body><main class="panel"><section id="start"><div class="gift" aria-hidden="true">🎁</div><h1>Feliz aniversário, Juliana Terneiro! 🥳</h1><p>Hoje você merece algo muito especial. Juliana, preparei uma surpresa exclusivamente para você!</p><button id="open">🎀 RESGATAR MEU PRESENTE</button><small>Feito com carinho ❤️</small></section><section id="waiting" hidden><h1>Preparando sua surpresa...</h1><div id="count" aria-live="polite">3</div></section><section id="reveal"><img src="surpresa.png" alt="É MENTIRA, ABESTADO!"/><h1>Juliana Terneiro, feliz aniversário! 😂🎂</h1><p>O presente era uma boa risada! Que seu dia seja maravilhoso!</p><button id="again">Ver de novo ↻</button></section></main><div id="confetti" aria-hidden="true"></div><script>const start=document.querySelector('#start'),waiting=document.querySelector('#waiting'),reveal=document.querySelector('#reveal'),count=document.querySelector('#count');document.querySelector('#open').addEventListener('click',()=>{start.hidden=true;waiting.hidden=false;let n=3;count.textContent=n;const timer=setInterval(()=>{n--;if(n){count.textContent=n}else{clearInterval(timer);waiting.hidden=true;reveal.style.display='block';const confetti=document.querySelector('#confetti');for(let i=0;i<85;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=['#ffda00','#e92356','#36c2ff','#63ca69'][i%4];p.style.animationDelay=Math.random()*.8+'s';confetti.appendChild(p);setTimeout(()=>p.remove(),4300)}}},1000)});document.querySelector('#again').addEventListener('click',()=>location.reload());</script></body></html>
